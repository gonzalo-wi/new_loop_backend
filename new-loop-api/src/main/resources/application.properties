spring.application.name=new-loop-api
spring.config.import=optional:file:new-loop-api/.env[.properties]

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loop_new_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Mappers walk LAZY relations row by row; batching turns each per-row lookup into one IN query per page.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Set HIBERNATE_STATS=true locally to log query counts per session (e.g. to verify N+1 fixes).
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_STATS:false}

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=86400000
# How long the JWT filter reuses a user's id/role/branch/active flag before re-reading it from the DB.
# Also the maximum delay for a deactivated user to lose access when the change didn't go through UserService.
app.security.user-cache.ttl=${USER_CACHE_TTL:2m}
app.security.user-cache.max-size=${USER_CACHE_MAX_SIZE:1000}

# Background jobs (integration retries, audit purge). Set SCHEDULING_ENABLED=false when running locally
# against a shared database so this instance doesn't re-send integrations.
app.scheduling.enabled=${SCHEDULING_ENABLED:true}

# Retention. Measured on 2026-10-05: ~220 audit events/day at ~630 bytes each (~50 MB/year), so a year is cheap.
app.audit.retention-days=${AUDIT_RETENTION_DAYS:365}
# Behind a reverse proxy set FORWARD_HEADERS_STRATEGY=native so audited IPs are the client's, not the proxy's.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Only SENT/CANCELLED integration logs are purged; failed ones stay until resolved.
app.integration-logs.retention-days=${INTEGRATION_LOG_RETENTION_DAYS:90}

# Integration issues (audit > Integraciones): an attempt with no answer after this long counts as stuck,
# and a record ready to send with no attempt at all counts as never sent.
app.integrations.stuck-after-minutes=${INTEGRATION_STUCK_AFTER_MINUTES:30}
# Only look this far back for never-sent records, so data from before the integration existed doesn't show up.
app.integrations.never-sent-lookback-days=${INTEGRATION_NEVER_SENT_LOOKBACK_DAYS:30}

# Aguas integration - stock controls
integrations.aguas.base-url=${AGUAS_BASE_URL:http://192.168.0.58}
integrations.aguas.max-retries=${AGUAS_MAX_RETRIES:5}
integrations.aguas.retry-interval-ms=${AGUAS_RETRY_INTERVAL_MS:300000}
# First retry pass waits after startup instead of firing while the app is still booting.
integrations.aguas.retry-initial-delay-ms=${AGUAS_RETRY_INITIAL_DELAY_MS:120000}

# Full HTTP request/response logging (headers included) for the Aguas client
logging.level.com.loop.new_loop_api.integrations.aguas.client.AguasClient=DEBUG

# Aguas integration - dispenser/equipment movements
integrations.aguas-equipment.base-url=${AGUAS_EQUIPMENT_BASE_URL:http://192.168.0.58}

# jMobile integration - dispensers flagged as "no registrado" (filtered out of UNLOAD movements).
# Checked while creating the movement, so the timeouts are kept short to not stall the scan.
integrations.jmobile.base-url=${JMOBILE_BASE_URL:http://35.199.104.218:8080}
spring.cloud.openfeign.client.config.unregisteredDispenserClient.connectTimeout=${JMOBILE_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.unregisteredDispenserClient.readTimeout=${JMOBILE_READ_TIMEOUT_MS:5000}

# Odoo integration - dispenser repair intake (only for UNLOAD movements)
integrations.odoo.base-url=${ODOO_BASE_URL:https://ivess.odoo.com}
integrations.odoo.api-key=${ODOO_API_KEY:LoopJumi-d9FxHYH5j2h_UxU5f-S8Vafg}

# Odoo integration - dispenser dispatch/salida to reparto (only for LOAD movements)
integrations.odoo.dispatch.base-url=${ODOO_DISPATCH_BASE_URL:https://ivess.odoo.com}
integrations.odoo.dispatch.api-key=${ODOO_DISPATCH_API_KEY:LoopJumi-d9FxHYH5j2h_UxU5f-S8Vafg}

# Powerfleet integration - truck GPS location lookup by license plate
integrations.powerfleet.base-url=${POWERFLEET_BASE_URL:https://www.monitoreodeflotas.com.ar/Fleetcore.Api}
integrations.powerfleet.username=${POWERFLEET_USERNAME:Eljumillanoapi}
integrations.powerfleet.password=${POWERFLEET_PASSWORD:Power2026}

# Mobile app version / APK distribution
app.apk.storage-path=${APK_STORAGE_PATH:./apk-storage}
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=256MB

# Observability - Actuator/Prometheus
# Only health/info/prometheus/metrics are exposed; /actuator/** stays behind HTTP Basic
# auth with dedicated monitoring credentials (see SecurityConfig), except /actuator/health.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=new-loop-api
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Dedicated Basic-auth credentials for scraping /actuator/** (Prometheus), separate from user JWT auth.
management.security.username=${ACTUATOR_USERNAME:prometheus}
management.security.password=${ACTUATOR_PASSWORD:changeme}
